name: Build

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: go.mod

      - name: Build
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: make test

  installers:
    name: Installer tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Lint install.sh
        if: runner.os == 'Linux'
        run: |
          sh -n install.sh
          shellcheck install.sh scripts/test-install.sh

      - name: Test install.sh
        run: sh scripts/test-install.sh

  installer-windows:
    name: Installer tests (windows-latest)
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Test install.ps1 (Windows PowerShell 5.1)
        shell: powershell
        run: ./scripts/test-install.ps1

      - name: Test install.ps1 (PowerShell 7)
        shell: pwsh
        run: ./scripts/test-install.ps1
